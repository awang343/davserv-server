# davserv config. By default this is read from ~/.config/davserv/config.toml
# (created automatically from this template on first run if missing) -
# fill in your Baikal details and re-run. You can also pass a different
# path as the first CLI argument.

bind_addr = "127.0.0.1:8080"

[baikal]
base_url = "http://localhost"
username = "alan"
password = "changeme"
# Path to the addressbook collection you want this server to manage.
# Find it via your CardDAV client setup, typically:
#   /dav.php/addressbooks/<username>/default/
addressbook_path = "/dav.php/addressbooks/alan/default/"
